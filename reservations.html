<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve | 90minutes Restaurant & Lounge</title>
    <link rel="stylesheet" href="style.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><span class="logo-text">90<span class="gold">minutes</span></span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="reservations.html" class="active">Reserve</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="hamburger"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <section class="section" style="padding-top: 140px;">
        <div class="container" style="max-width: 600px;">
            <h1 class="section-title">Reserve Your Table</h1>
            
            <div class="glass-card" style="padding: 40px;">
                <form style="display: flex; flex-direction: column; gap: 20px;">
                    <input type="text" placeholder="Full Name" required style="padding: 15px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.05); color: #fff; font-family: Poppins;">
                    <input type="email" placeholder="Email" required style="padding: 15px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.05); color: #fff;">
                    <input type="tel" placeholder="Phone" required style="padding: 15px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.05); color: #fff;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <input type="date" required style="padding: 15px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.05); color: #fff;">
                        <input type="time" required style="padding: 15px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.05); color: #fff;">
                    </div>
                    <select required style="padding: 15px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,255,0.05); color: #fff;">
                        <option value="">Number of Guests</option>
                        <option>1-2</option><option>3-4</option><option>5-6</option><option>7+</option>
                    </select>
                    <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 10px;">Confirm Reservation</button>
                </form>
                
                <div style="text-align: center; margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <p style="margin-bottom: 15px;">Or book instantly via WhatsApp</p>
                    <a href="https://wa.me/441206123456?text=Hi%2090minutes,%20I%20want%20to%20reserve%20a%20table" class="btn btn-gold" target="_blank">
                        <i class="fab fa-whatsapp"></i> WhatsApp Booking
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div class="floating-buttons">
        <a href="https://wa.me/441206123456" class="float-btn whatsapp" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="tel:+441206123456" class="float-btn call"><i class="fas fa-phone"></i></a>
    </div>

    <script>
        document.querySelector('.hamburger').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('active');
        });
    </script>
</body>
</html>
